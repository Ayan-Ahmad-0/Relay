services:
  - type: web
    name: relay-api
    env: python
    buildCommand: uv sync
    startCommand: uv run uvicorn relay.api:app --host 0.0.0.0 --port $PORT
    plan: starter
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-postgres
          property: connectionString
      - key: SINK_URL
        value: https://relay-api.onrender.com/sink
      - key: RELAY_FEATURE_FLAG
        value: "true"

  - type: worker
    name: relay-worker
    env: python
    buildCommand: uv sync
    startCommand: uv run python -m relay.worker --worker-id render-worker-1
    plan: starter
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-postgres
          property: connectionString
      - key: SINK_URL
        value: https://relay-api.onrender.com/sink

databases:
  - name: relay-postgres
    plan: starter
    databaseName: relay_prod
    user: relay
